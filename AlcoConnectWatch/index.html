<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlcoConnect Watch — Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            gold: {
              50:  '#fdf8ed', 100: '#f9edcc', 200: '#f3d994', 300: '#ecc55c',
              400: '#e5b134', 500: '#d4a853', 600: '#b8860b', 700: '#8b6914',
              800: '#6b5210', 900: '#4a390b'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="font-sans" x-data="{
  loading: false,
  showPassword: false,
  email: 'admin@alcoconnectwatch.com',
  password: 'admin123',
  error: '',
  async login() {
    this.loading = true;
    this.error = '';
    try {
      var res = await fetch('api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: this.email, password: this.password })
      });
      var data = await res.json();
      if (data.success) {
        localStorage.setItem('acw_token', data.token);
        localStorage.setItem('acw_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } else {
        this.error = data.message || 'Login failed';
        this.loading = false;
      }
    } catch (e) {
      this.error = 'Connection error. Is the server running?';
      this.loading = false;
    }
  }
}" x-cloak>

  <!-- ========== LOGIN BACKGROUND ========== -->
  <div class="login-bg flex items-center justify-center px-4 py-8">

    <!-- Gold particles -->
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>
    <div class="gold-particle"></div>

    <!-- ========== LOGIN CARD ========== -->
    <div class="login-card w-full max-w-md rounded-2xl p-8 shadow-2xl relative z-10">

      <!-- Brand -->
      <div class="login-brand text-center mb-8">
        <div class="brand-icon mx-auto mb-4">
          <i class="bi bi-shield-check text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">
          AlcoConnect <span class="text-gold-600">Watch</span>
        </h1>
        <p class="text-sm text-gray-400 mt-1">File Watcher & Compliance Report System</p>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="h-px flex-1 bg-gray-200"></div>
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Sign in to continue</span>
        <div class="h-px flex-1 bg-gray-200"></div>
      </div>

      <!-- Login Form -->
      <form @submit.prevent="login()" class="space-y-5">

        <!-- Error Message -->
        <div x-show="error" x-transition class="p-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700 text-center" x-text="error"></div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
          <div class="relative">
            <input type="email" x-model="email" class="login-input" placeholder="admin@alcoconnectwatch.com" required>
            <i class="bi bi-envelope login-input-icon"></i>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="password" class="login-input pr-12" placeholder="Enter your password" required>
            <i class="bi bi-lock login-input-icon"></i>
            <button type="button" @click="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gold-600 transition-colors p-1">
              <i :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-gold w-full flex items-center justify-center gap-2 mt-2" :disabled="loading">
          <template x-if="!loading">
            <span class="flex items-center gap-2">
              <span>Sign In</span>
              <i class="bi bi-arrow-right"></i>
            </span>
          </template>
          <template x-if="loading">
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              <span>Signing in...</span>
            </span>
          </template>
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <div class="flex items-center justify-center gap-2 text-xs text-gray-400">
          <i class="bi bi-geo-alt"></i>
          <span>3 Mining Sites</span>
          <span class="text-gray-300">|</span>
          <i class="bi bi-database"></i>
          <span>SQL Server</span>
          <span class="text-gray-300">|</span>
          <i class="bi bi-hdd-rack"></i>
          <span>IIS Hosted</span>
        </div>
        <p class="text-xs text-gray-300 mt-3">&copy; 2026 AlcoConnect Watch Compliance System &middot; v1.0 MVP</p>
      </div>
    </div>
  </div>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</body>
</html>
